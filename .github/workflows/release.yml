# Builds the addon package on every version tag (e.g. v1.1.0) and publishes it.
# Targets are enabled via secrets and the IDs in the TOC (see README, section "Release"):
#   GitHub Releases: always (GITHUB_TOKEN is available automatically)
#   Wago:            Secret WAGO_API_TOKEN + "## X-Wago-ID" in the TOC
#   CurseForge:      Secret CF_API_KEY     + "## X-Curse-Project-ID" in the TOC
#
# Tags ending in "-cfonly" (e.g. v1.0.1-beta1-cfonly) only go to CurseForge –
# for test uploads, without a GitHub release and without Wago.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ !endsWith(github.ref_name, '-cfonly') && secrets.GITHUB_TOKEN || '' }}
      WAGO_API_TOKEN: ${{ !endsWith(github.ref_name, '-cfonly') && secrets.WAGO_API_TOKEN || '' }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use only this version's section from CHANGELOG.md as "What's new"
      - name: Extract changelog for this version
        run: python3 .github/scripts/extract_changelog.py "${{ github.ref_name }}"
      - uses: BigWigsMods/packager@v2
