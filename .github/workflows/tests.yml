# Runs the offline regression tests on every push and pull request.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - name: Lua tests
        run: for test in Tools/test_*.lua; do luajit "$test"; done
      - name: Python syntax
        run: python3 -m py_compile Tools/*.py .github/scripts/extract_changelog.py
